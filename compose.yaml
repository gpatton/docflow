services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: ${DOCFLOW_DB_PASSWORD:?Set DOCFLOW_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - docflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://docflow:${DOCFLOW_DB_PASSWORD}@postgres:5432/docflow
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  docflow-postgres-data:
